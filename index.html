    <style>
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(196, 199, 199, 0.25);
        }

        .element-cell {
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .element-cell::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1.5px solid transparent;
            border-radius: inherit;
            transition: border-color 0.3s ease;
            pointer-events: none;
        }

        .element-cell:hover::after {
            border-color: #007AFF;
        }

        /* Category left borders */
        .category-alkali { border-left: 3px solid #ff6b6b; }
        .category-alkaline-earth { border-left: 3px solid #ff9f43; }
        .category-transition { border-left: 3px solid #feca57; }
        .category-basic-metal { border-left: 3px solid #1dd1a1; }
        .category-metalloid { border-left: 3px solid #0abde3; }
        .category-nonmetal { border-left: 3px solid #5f27cd; }
        .category-halogen { border-left: 3px solid #341f97; }
        .category-noble-gas { border-left: 3px solid #ee5253; }
        .category-lanthanide { border-left: 3px solid #10b981; }
        .category-actinide { border-left: 3px solid #d946ef; }

        /* Grid Layout */
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(0, 1fr));
            grid-template-rows: repeat(10, minmax(0, 1fr));
            gap: 6px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Scroll Animations */
        .reveal-up {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-up.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Electron Orbit Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .orbit-ring {
            animation: spin linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .molecule-float {
            animation: float 4s ease-in-out infinite;
        }

    <!-- Global Particle Canvas Shader Background -->
    <div class="fixed inset-0 z-[-1] opacity-25 pointer-events-none">

    <!-- WebGL Background Shader Script -->
    <script>
    (function() {
        const canvas = document.getElementById('shader-canvas-ANIMATION_2');
        function syncSize() {
            const w = window.innerWidth || 1280;
            const h = window.innerHeight || 720;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
        }
        window.addEventListener('resize', syncSize);
        syncSize();

        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return;

        const vs = `attribute vec2 a_position;
        varying vec2 v_texCoord;
        void main() {
            v_texCoord = a_position * 0.5 + 0.5;
            gl_Position = vec4(a_position, 0.0, 1.0);
        }`;

        const fs = `precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        varying vec2 v_texCoord;

        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        void main() {
            vec2 uv = v_texCoord;
            vec2 pos = uv * 5.0;
            vec2 ipos = floor(pos);
            vec2 fpos = fract(pos);
            
            float m_dist = 1.0;
            for (int y = -1; y <= 1; y++) {
                for (int x = -1; x <= 1; x++) {
                    vec2 neighbor = vec2(float(x), float(y));
                    vec2 point = vec2(hash(ipos + neighbor), hash(ipos + neighbor + 123.4));
                    point = 0.5 + 0.5 * sin(u_time * 0.2 + 6.2831 * point);
                    vec2 diff = neighbor + point - fpos;
                    float dist = length(diff);
                    m_dist = min(m_dist, dist);
                }
            }
            
            vec3 color = vec3(0.98, 0.98, 0.98);
            float particles = 1.0 - smoothstep(0.0, 0.025, m_dist);
            color = mix(color, vec3(0.0, 0.35, 0.85), particles * 0.12);
            gl_FragColor = vec4(color, 1.0);
        }`;

        function createShader(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        const posLoc = gl.getAttribLocation(prog, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(prog, 'u_time');
        const uRes = gl.getUniformLocation(prog, 'u_resolution');

        function render(t) {
            gl.viewport(0, 0, canvas.width, canvas.height);
            if (uTime) gl.uniform1f(uTime, t * 0.001);
            if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render(0);
    })();
    </script>
